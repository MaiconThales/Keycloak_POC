<!doctype html>
<html lang="pt-BR" ng-app="pocKeycloakApp">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>POC Keycloak</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <link rel="stylesheet" href="app/layout/layout.css">
</head>
<body class="bg-body-tertiary">
    <poc-topbar></poc-topbar>
    <main id="app" class="container pt-5 mt-2 pb-4" tabindex="-1">
        <div class="row g-4">
            <poc-sidebar></poc-sidebar>
            <div class="col-12 col-lg-9">
                <div ng-if="currentView === 'login'" ng-include="'app/auth/login.html'"></div>
                <div ng-if="currentView === 'products'" ng-include="'app/products/products.html'"></div>
                <div ng-if="currentView === 'users'" ng-include="'app/users/users.html'"></div>
            </div>
        </div>
    </main>

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
    <script src="app/auth/auth.module.js"></script>
    <script src="app/auth/authService.js"></script>
    <script src="app/auth/authInterceptor.js"></script>
    <script src="app/auth/auth.config.js"></script>
    <script src="app/auth/loginController.js"></script>
    <script src="app/products/products.module.js"></script>
    <script src="app/products/productsService.js"></script>
    <script src="app/products/productsController.js"></script>
    <script src="app/sidebar/sidebar.module.js"></script>
    <script src="app/sidebar/sidebar.directive.js"></script>
    <script src="app/topbar/topbar.module.js"></script>
    <script src="app/topbar/topbar.directive.js"></script>
    <script src="app/app.module.js"></script>
    <script src="app/app.routes.js"></script>
    <script src="app/app.navigation.js"></script>
</body>
</html>
