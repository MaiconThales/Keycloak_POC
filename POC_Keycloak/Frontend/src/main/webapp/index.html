<!doctype html>
<html lang="pt-BR" ng-app="pocKeycloakApp">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>POC Keycloak</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>
<body class="bg-body-tertiary">
    <header class="bg-white border-bottom shadow-sm">
        <div class="container py-3 d-flex flex-wrap align-items-center justify-content-between gap-3">
            <h1 class="h4 mb-0">POC Keycloak</h1>
            <nav class="nav nav-pills gap-2" aria-label="Navegacao principal">
                <a class="nav-link" href="#!/products"
                   ng-class="{'active': currentView === 'products'}"
                   ng-attr-aria-current="{{currentView === 'products' ? 'page' : undefined}}">Produtos</a>
                <a class="nav-link" href="#!/login"
                   ng-class="{'active': currentView === 'login'}"
                   ng-attr-aria-current="{{currentView === 'login' ? 'page' : undefined}}">Login</a>
            </nav>
        </div>
    </header>
    <main id="app" class="container py-4 py-md-5" tabindex="-1">
        <div ng-if="currentView === 'login'" ng-include="'app/auth/login.html'"></div>
        <div ng-if="currentView === 'products'" ng-include="'app/products/products.html'"></div>
    </main>

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
    <script src="app/auth/auth.module.js"></script>
    <script src="app/auth/authService.js"></script>
    <script src="app/auth/authInterceptor.js"></script>
    <script src="app/auth/auth.config.js"></script>
    <script src="app/auth/loginController.js"></script>
    <script src="app/products/products.module.js"></script>
    <script src="app/products/productsService.js"></script>
    <script src="app/products/productsController.js"></script>
    <script src="app/app.module.js"></script>
    <script src="app/app.navigation.js"></script>
</body>
</html>
